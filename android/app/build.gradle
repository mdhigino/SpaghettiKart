plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.mdhigino.mk64family'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.mdhigino.mk64family'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Fixed signing key (family-only app, not a secret): every CI build is signed the same way,
    // so a new APK installs over the old one and keeps the game files in Android/data.
    signingConfigs {
        family {
            storeFile file('family.jks')
            storePassword 'mk64family'
            keyAlias 'mk64family'
            keyPassword 'mk64family'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.family
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.family
        }
    }

    // The native libraries (libmain.so, libSDL2.so, ...) are built by CMake
    // outside of Gradle and dropped here, see .github/workflows/android.yml.
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        jniLibs {
            // Extract the .so files to disk so MainActivity can check for libhidapi.so.
            useLegacyPackaging = true
        }
    }
}
