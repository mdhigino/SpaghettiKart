name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [android-port]

permissions:
  contents: write # needed only to publish build logs to the ci-logs branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3
          cmake --version
          echo "NDK: ${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"

      # spaghetti.o2r holds the port's own assets (shaders, fonts, tracks...). It must be
      # the same version as the code, so it is generated here with the Torch tool from
      # this exact commit and bundled into the APK. It contains nothing from the ROM.
      - name: Generate spaghetti.o2r with Torch (host build)
        run: |
          exec > >(tee torch.log) 2>&1
          set -x
          sudo apt-get install -y libsdl2-dev libpng-dev libzip-dev nlohmann-json3-dev libtinyxml2-dev libspdlog-dev libboost-dev
          cmake -S torch -B build-torch -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DUSE_STANDALONE=ON -DBUILD_STORMLIB=OFF -DBUILD_SM64=OFF -DBUILD_MK64=ON \
            -DBUILD_SF64=OFF -DBUILD_FZERO=OFF -DBUILD_MARIO_ARTIST=OFF -DBUILD_NAUDIO=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build-torch -j"$(nproc)"
          ./build-torch/torch pack assets spaghetti.o2r o2r
          ls -l spaghetti.o2r
          python3 -c "import zipfile; n=zipfile.ZipFile('spaghetti.o2r').namelist(); print('entries:', len(n)); print([x for x in n if 'shader' in x])"
          mkdir -p android/app/src/main/assets
          cp spaghetti.o2r android/app/src/main/assets/spaghetti.o2r

      - name: Configure native build (arm64)
        run: |
          set -o pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DUSE_OPENGLES=ON 2>&1 | tee configure.log

      - name: Build native library
        run: |
          set -o pipefail
          # "-k 0": keep going after a failure so one run reports every error.
          cmake --build build-android -j"$(nproc)" --target Spaghettify -- -k 0 2>&1 | tee build.log

      - name: Collect native libraries and SDL Java sources
        run: |
          exec > >(tee collect.log) 2>&1
          set -x
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          JNI=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI"
          find build-android -name '*.so' -print
          find build-android \( -name libmain.so -o -name libSDL2.so -o -name libhidapi.so \) -exec cp -v {} "$JNI"/ \;
          ls -l "$JNI"
          test -f "$JNI/libmain.so" && test -f "$JNI/libSDL2.so"
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "$JNI"/*.so
          SDL_SRC="$(find build-android/_deps -maxdepth 1 -type d -name 'sdl2-src' | head -n 1)"
          echo "SDL source: $SDL_SRC"
          mkdir -p android/app/src/main/java/org
          cp -r "$SDL_SRC/android-project/app/src/main/java/org/libsdl" android/app/src/main/java/org/

      - name: Build APK
        run: |
          exec > >(tee gradle.log) 2>&1
          set -x
          # Gradle 8.9 is what Android Gradle Plugin 8.7 needs (the runner's own Gradle is newer).
          curl -fsSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          export PATH=/opt/gradle-8.9/bin:$PATH
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          gradle -p android assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MK64Familia-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish build logs to the ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/cilogs && cd /tmp/cilogs
          git init -q
          for f in torch.log configure.log build.log collect.log gradle.log; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then
              tail -n 300 "$GITHUB_WORKSPACE/$f" > "$f.tail.txt"
              # Keep the LAST matches: the real failure is almost always at the end.
              grep -n -E "error:|FAILED|CMake Error|undefined reference|undefined symbol|fatal|No such file|not found|What went wrong" -A3 "$GITHUB_WORKSPACE/$f" | tail -n 300 > "$f.errors.txt" || true
            fi
          done
          echo "run=${{ github.run_id }} status=${{ job.status }} sha=${{ github.sha }}" > STATUS.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI logs for run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-logs
